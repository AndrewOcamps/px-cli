[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxmox-cli"
version = "0.3.0"
description = "A command-line tool for managing Proxmox VE clusters"
readme = "README.md"
license = {text = "MIT"}
keywords = ["proxmox", "ve", "cli", "virtualization", "pve"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "typer>=0.9",
    "requests>=2.25",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.urls]
Homepage = "https://github.com/AndrewOcamps/promox-cli"
Source = "https://github.com/AndrewOcamps/promox-cli"
Changelog = "https://github.com/AndrewOcamps/promox-cli/blob/main/CHANGELOG.md"

[project.scripts]
px = "px_cli.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "requests-mock>=1.11",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/px_cli"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
